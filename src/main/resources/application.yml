spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ai_doc_db?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&tcpKeepAlive=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sk_dummy_password_for_github}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # connection-timeout: 30000
      # idle-timeout: 600000
      # maximum-pool-size: 10
      # minimum-idle: 5
      max-lifetime: 1200000 # 20分钟强制换一次连接
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart: 
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  upload:
    dir: uploads

ai:
  api-key: ${DEEPSEEK_API_KEY:sk-this-is-a-fake-key-do-not-use}
  api-url: "https://api.deepseek.com/chat/completions"
